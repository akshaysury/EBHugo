{{ $active := . }}
<div class="justify-content-center d-print-none eb-nav">
    <ul class="nav nav-pills justify-content-center mt-4">
        <li class="nav-item mb-2">
            <a class="nav-link {{ if eq $active "Home" }}active{{ end }}" href="/">Home</a>
        </li>
        <li class="nav-item mb-2">
            <a class="nav-link {{ if eq $active "Recipes" }}active{{ end }}" href="/posts">Recipes</a>
        </li>
        <li class="nav-item mb-2">
            <a class="nav-link {{ if eq $active "More" }}active{{ end }}" href="/more">More</a>
        </li>
        <li class="nav-item mb-2">
            <a class="nav-link {{ if eq $active "About" }}active{{ end }}" href="/about">About</a>
        </li>
        <li class="nav-item mb-2">
            <a class="nav-link {{ if eq $active "Mood Playlists" }}active{{ end }}" href="/playlists">Mood Playlists</a>
        </li>
        <li class="nav-item mb-2">
            <a class="nav-link {{ if eq $active "Store" }}active{{ end }}" href="/store">Store</a>
        </li>
        <li class="nav-item mb-2 border border-dark rounded">
            <a class="nav-link" id="eb-jr-link" href="/jr/">EB Jr</a>
        </li>
    </ul>
</div>
<div class="justify-content-center d-print-none eb-nav">
    <ul class="nav nav-pills justify-content-center mt-4">
        <li class="nav-item d-flex mb-2">
            <input class="form-control me-2 eb-btn-search-query" type="search" placeholder="Search" aria-label="Search">
            <button class="btn btn-outline-success eb-btn-search" type="submit">Search</button>
        </li>
    </ul>
</div>
<script type="text/javascript">
    (function() {
        var host = window.location.hostname;
        var link = document.getElementById('eb-jr-link');
        if (host === 'emotionalbaking.ca' || host === 'www.emotionalbaking.ca') {
            link.href = 'https://emotionalbakingjr.ca';
        } else if (host === 'emotionalbaking.com' || host === 'www.emotionalbaking.com') {
            link.href = 'https://emotionalbakingjr.com';
        }
    })();
    function search_keypress() {
        var searchfield = document.getElementsByClassName("eb-btn-search-query")[0];
        searchfield.addEventListener("keyup", function(event) {
            event.preventDefault();
            if (event.keyCode === 13) {
                document.location.href = "/search/?query=" + searchfield.value;
            }
        });
    }
    document.getElementsByClassName("eb-btn-search")[0].onclick = function () {
        var searchfield = document.getElementsByClassName("eb-btn-search-query")[0];
        document.location.href = "/search/?query=" + searchfield.value;
    };
    document.addEventListener("DOMContentLoaded", function(event) {
        search_keypress();
    });
</script>
