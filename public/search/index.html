<script type="text/javascript">
    function search_keypress() {
        var searchfield = document.getElementsByClassName("eb-btn-search-query")[0];
        searchfield.addEventListener("keyup", function(event) {
            event.preventDefault();
            if (event.keyCode === 13) {
                document.location.href = "/search/?query=" + searchfield.value;
            }
        });
    }
    document.getElementsByClassName("eb-btn-search")[0].onclick = function () {
        var searchfield = document.getElementsByClassName("eb-btn-search-query")[0];
        document.location.href = "/search/?query=" + searchfield.value;
    };
    document.addEventListener("DOMContentLoaded", function(event) {
        search_keypress();
    });
</script>

<div class="row justify-content-center mt-3 fs-6">
    <div class="col-12 col-sm-12 col-md-10 col-lg-8">
        <div id="search-results"></div>
    </div>
</div>
<script>
(function() {
    var query = new URLSearchParams(window.location.search).get("query") || "";
    if (!query) return;

    fetch("/search-index.json")
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var fuse = new Fuse(data, {
                keys: [
                    { name: "emotion", weight: 0.3 },
                    { name: "title",   weight: 0.2 },
                    { name: "tags",    weight: 0.2 },
                    { name: "description", weight: 0.15 },
                    { name: "ingredients", weight: 0.15 }
                ],
                threshold: 0.4,
                includeScore: true
            });
            var results = fuse.search(query);
            var html = "<h5>Results for <em>" + query + "</em></h5>";
            if (results.length === 0) {
                html += "<p>No results found.</p>";
            } else {
                html += '<div class="row gx-5 eb-post-list">';
                results.forEach(function(r) {
                    var item = r.item;
                    html += '<div class="mt-4 col-6 col-sm-4 col-md-4 col-lg-3">';
                    html += '<a href="' + item.permalink + '" class="eb-featured-post fs-7">';
                    html += '<div class="row"><img loading="lazy" src="/assets/images/posts/' + item.slug + '/featured.jpg"></div>';
                    html += '<div class="row featured-text text-center"><div>';
                    html += '<span class="eb-color-main"><strong>' + item.emotion.charAt(0).toUpperCase() + item.emotion.slice(1) + '</strong></span> ';
                    html += item.opening_title;
                    html += '</div></div></a></div>';
                });
                html += '</div>';
            }
            document.getElementById("search-results").innerHTML = html;
        });
})();
</script>
